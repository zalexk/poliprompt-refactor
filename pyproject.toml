[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "poliprompt"
version = "0.2.1"
description = "PoliPrompt: a multimodal agentic framework for automated text classification"
authors = [
    {name = "Menglin Liu", email = "mliliu@ucdavis.edu"},
    {name = "Ge Shi", email = "geshijoker@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["nlp", "llm", "text-classification", "political-science", "few-shot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"

# Core runtime dependencies — provider SDKs are in optional groups below.
dependencies = [
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langgraph>=0.2",
    "faiss-cpu>=1.7",
    "tenacity>=8.0",
    "python-dotenv>=1.0",
    "tqdm>=4.60",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "ipykernel>=7.2.0",
]

# ---------------------------------------------------------------------------
# Optional dependency groups (install with: uv sync --extra <name>)
# ---------------------------------------------------------------------------

[project.optional-dependencies]

# LLM / embedding providers — install at least one.
openai = [
    "openai>=1.0",
    "langchain-openai>=0.1",
]
qwen = [
    # Required for multimodal embeddings and Qwen inference.
    "dashscope>=1.14",
]
google = [
    "google-generativeai>=0.5",
    "langchain-google-genai>=1.0",
]

# Optional features
streamlit = [
    # Streamlit annotation UI for interactive HITL labeling.
    "streamlit>=1.30",
]
observability = [
    # Langfuse tracing integration.
    "langfuse>=4.0",
]

# Convenience meta-extra: all optional features.
all = [
    "poliprompt[openai,qwen,google,anthropic,streamlit,observability]",
]
anthropic = [
    "anthropic>=0.9",
    "langchain-anthropic>=1.4.0",
]

# ---------------------------------------------------------------------------
# Project URLs
# ---------------------------------------------------------------------------

[project.urls]
Documentation = "https://github.com/geshijoker/PoliPrompt/tree/main/docs"
Source = "https://github.com/geshijoker/PoliPrompt"
Issues = "https://github.com/geshijoker/PoliPrompt/issues"

# ---------------------------------------------------------------------------
# Development dependencies (uv only — not included in the published package)
# Install with: uv sync --group dev
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    # Linting, formatting (replaces black, flake8, isort, pylint)
    "ruff>=0.4",
    # Testing
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "hypothesis>=6.100",
    "coverage[toml]>=7.0",
]

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/poliprompt"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces black, flake8, isort, pylint)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with slice formatting)
    "B008",  # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["poliprompt"]

# ruff format replaces black; line-length is inherited from [tool.ruff].

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing -m 'not integration'"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: marks as integration test (requires live API keys, deselected by default)",
    "unit: fast offline tests",
    "slow: marks tests as slow",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
reportMissingImports = true
reportMissingTypeStubs = false
