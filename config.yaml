project:
  name: MyProject
  version: v1
  modality: multimodal
  work_station: D:\PoliPrompt-Refactor
  data_path: train-tiny.jsonl
  image_dir: .
  outfiles_dir: outfiles
column_mapping:
  text_col: text
  image_col: img
  answer_col: label
user_settings:
  lambda_param: 0.5
  k_shots: 3
  options:
  - '0'
  - '1'
  testing: false
  testing_size: 128
models:
  embedding_llm: qwen3-vl-embedding
  primary_llm: gpt-4o-mini
  secondary_llm: qwen-vl-max
  expert_llm: o4-mini
retrieval:
  n_exemplars_pool: 256
parallel:
  embedding_workers: 8
  inference_workers: 2
  embedding_batch_size: 5
observability:
  enabled: true
  provider: langfuse
