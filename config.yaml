# ==========================================
# PoliPrompt v3.2 Configuration File
# ==========================================

project:
  name: "MyProject"
  version: "v1"
  modality: "multimodal"        # "text" or "multimodal"
  work_station: "D:/PoliPrompt-main/examples/HatefulMemes"
  data_path: "train.jsonl"      # relative to work_station
  image_dir: "."                # relative to work_station (multimodal only)
  outfiles_dir: "outfiles"      # relative to work_station

column_mapping:
  text_col: "text"
  image_col: "img"              # set to "None" for text-only tasks
  answer_col: "label"

user_settings:
  lambda_param: 0.5             # 0 = max diversity, 1 = max similarity
  k_shots: 3
  options: ["0", "1"]
  testing: false
  testing_size: 128

models:
  embedding_llm: "qwen"         # use "qwen" for multimodal, "openai" for text-only
  primary_llm: "gpt-4o"
  secondary_llm: "gemini-2.5-flash"
  expert_llm: "gemini-2.5-pro"

retrieval:
  n_exemplars_pool: 256

parallel:
  embedding_workers: 8          # 并发批次数，IO 密集，推荐 8-12
  inference_workers: 2          # inference 并发，受 API 限速，推荐 2-4
  embedding_batch_size: 5       # 每批样本数：Qwen 推荐 5，OpenAI 推荐 32

observability:
  enabled: true
  provider: "langfuse"
