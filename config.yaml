  # ==========================================
# PoliPrompt v2 Configuration File
# ==========================================

project:
  name: "Multimodal Classification with PoliPrompt v2"
  version: "v1"
  modality: "multimodal"    # "multimodal" 或 "text"
  work_station: "D:/PoliPrompt-main/examples/HatefulMemes"   # 用户工作目录绝对路径
  data_path: "train.jsonl"   # 相对于 work_station
  image_dir: "."         # 相对于 work_station（多模态时必需）
  outfiles_dir: "outfiles" # 相对于 work_station

column_mapping:
  text_col: "text"
  image_col: "img"                 # 多模态时必需
  answer_col: "label"

user_settings:
  lambda_param: 0.5                # 0: 完全多样性, 1: 纯相似度
  k_shots: 3
  options: ["0", "1"]  # 可选标签列表
  testing: false
  testing_size: 128

models:
  embedding_llm: "qwen"
  primary_llm: "gpt-4o-mini"
  secondary_llm: "qwen-vl-max"
  expert_llm: "gpt-4o"

retrieval:
  n_exemplars_pool: 256

parallel:
  num_workers: 2

observability:
  enabled: true
  provider: "langfuse"               # 待调研